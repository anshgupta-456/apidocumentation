name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acv
          POSTGRES_PASSWORD: acv
          POSTGRES_DB: acv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          # Same "postgres://" form hosting providers hand out, to exercise URL normalisation too.
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://acv:acv@localhost:5432/acv_test' || '' }}
        run: pytest -q
